[package]
name = "agent-mcp"
description = "cc-relay stdio MCP server. Calls a Broker (P4 / #16) for cross-agent state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
agent-broker = { path = "../agent-broker" }

anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
thiserror = "2"
tracing = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync"] }
# NOTE: tokio-tungstenite の `rustls-tls-webpki-roots` は同 PR では触っていない。
# sandbox からの wss 挙動が未検証のため follow-up に分ける (Phase F #37)。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
# reqwest は OS trust store を読む native-roots に固定 (詳細は
# `crates/agent-broker/Cargo.toml` のコメント参照)。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "schemars"] }

[dev-dependencies]
# Broker is `#[async_trait]` so test-double impls also need it.
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
# Installed once per process via test_utils::ensure_tracing() so that
# tracing macro field args (`%foo.display()` etc.) actually evaluate
# during test runs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
