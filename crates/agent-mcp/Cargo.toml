[package]
name = "agent-mcp"
description = "cc-relay stdio MCP server. Calls a Broker (P4 / #16) for cross-agent state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
agent-broker = { path = "../agent-broker" }

anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
thiserror = "2"
tracing = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync"] }
# Issue #50 / Phase F #37: CCoW container は HTTPS intercepting proxy の独自 CA を
# 信頼する必要があるため、reqwest と同じく OS trust store (`rustls-tls-native-roots`)
# に揃える。webpki-roots だと sandbox 内で `UnknownIssuer` で fail する
# (`rust-mcp-agent probe` で実測済み)。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots", "url"] }
# reqwest は OS trust store を読む native-roots に固定 (詳細は
# `crates/agent-broker/Cargo.toml` のコメント参照)。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "schemars"] }

[dev-dependencies]
# Broker is `#[async_trait]` so test-double impls also need it.
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
