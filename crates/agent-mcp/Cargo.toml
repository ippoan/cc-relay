[package]
name = "agent-mcp"
description = "cc-relay stdio MCP server that relays tool calls to the local daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core", features = ["io"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
tracing = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "schemars"] }
