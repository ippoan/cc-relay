[package]
name = "agent-broker"
description = "cc-relay Broker trait + GitHubBroker impl (cross-sandbox state via GitHub Issues)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core" }

anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "time", "sync"] }
dirs = "5"

[dev-dependencies]
# wiremock spins up an in-process HTTP server that GitHubBroker is pointed
# at via `with_base_url`. Lets tests assert on request shape (headers,
# body, query) without touching api.github.com.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
