[package]
name = "agent-broker"
description = "cc-relay Broker trait + GitHubBroker impl (cross-sandbox state via GitHub Issues)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core" }

anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# GitHub App auth (ADR-007 / #69): RS256 sign the app JWT used to mint an
# installation access token. `cc-relay-agent[bot]` identity が wake-trigger
# comment を打つために必要 (end-user identity だと harness の self-filter で
# 弾かれる)。
jsonwebtoken = "9"

# `rustls-tls-native-roots` ではなく `rustls-tls` (= webpki-roots) を使うと、
# Claude Code on Web sandbox の HTTPS intercepting proxy CA を信頼できず
# `UnknownIssuer` で fail する。OS trust store を読む native-roots に固定する。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "time", "sync"] }
dirs = "6"

[dev-dependencies]
# wiremock spins up an in-process HTTP server that GitHubBroker is pointed
# at via `with_base_url`. Lets tests assert on request shape (headers,
# body, query) without touching api.github.com.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Installed once per process via `tests::ensure_tracing()` so that
# `tracing::warn!(field = %x.display(), ...)` lazy formatter args
# actually evaluate during test runs — without a subscriber installed,
# llvm-cov reports those argument expressions as zero-count even though
# the surrounding `warn!` line did execute.
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
