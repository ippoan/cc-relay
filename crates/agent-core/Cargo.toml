[package]
name = "agent-core"
description = "Wire protocol types for cc-relay (Rust source of truth, ts-rs exports TypeScript)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables async I/O helpers for /tmp/agent-inbox.jsonl. Used by agent-daemon
# and agent-mcp; coordinator never enables this feature.
io = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# ts-rs is a `dependencies` (not dev-dependencies) entry because the export
# happens inside a `#[test]` at the bottom of protocol.rs which lives in src/,
# and that test compiles ts-rs into the lib's test harness.
ts-rs = { version = "10", features = ["serde-compat"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"], optional = true }
