[package]
name = "agent-cli"
description = "rust-mcp-agent binary: clap dispatcher for the stdio MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "rust-mcp-agent"
path = "src/main.rs"

[dependencies]
agent-broker = { path = "../agent-broker" }
agent-mcp = { path = "../agent-mcp" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# webpki-roots ではなく OS trust store を読み込ませる必要がある (詳細は
# `crates/agent-broker/Cargo.toml` のコメント参照、Claude Code on Web の
# HTTPS intercepting proxy CA との互換性のため)。workspace の reqwest
# feature unification 目的でこちらも合わせて native-roots に固定。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
