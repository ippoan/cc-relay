name: branch-protection-drift

# Catches silent drift between .github/branch-protection.yml (declared
# required checks) and what CI actually produces on main. See the spec
# file header for the rationale and the drift-check reusable's source
# (ippoan/ci-workflows/.github/workflows/branch-protection-drift-check.yml)
# for the failure-mode taxonomy.
#
# Currently `continue-on-error: true`: the drift-check reusable inspects
# only the single tip commit of `head_ref`, and main's tip can be a
# deploy-only / docs / auto-merge commit that didn't fire ci.yml — in
# which case every spec entry shows as a phantom even though every PR
# produces them correctly. The annotation + Job Summary stay visible
# for operator review until the reusable is improved to aggregate
# across the most recent N commits (or query workflow_runs by id),
# at which point this flag should be removed.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/branch-protection.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
  schedule:
    # Weekly Monday sanity check — catches drift introduced by changes
    # to the upstream reusable workflows (ippoan/ci-workflows) that
    # rename jobs without a corresponding cc-relay PR touching `paths`.
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  drift:
    # See file header for why this is non-blocking right now.
    continue-on-error: true
    uses: ippoan/ci-workflows/.github/workflows/branch-protection-drift-check.yml@main
    permissions:
      contents: read
      checks: read
