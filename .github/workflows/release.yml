name: release

# Two ways to trigger a release:
# 1. Push a tag matching `v*.*.*` (or `v*.*.*-*` for pre-releases).
# 2. Actions → release → "Run workflow", providing a tag_name.
#    On manual dispatch the tag is created from the dispatched branch
#    (typically `main`) by softprops/action-gh-release.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create (e.g. v0.0.1-pre, v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: rust-mcp-agent-x86_64-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      # apt-package cache so subsequent runs skip the ~10–15 s
      # apt-get update + install. `musl-tools` is the only system
      # package the release path needs.
      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # `shared-key` (not `key`) so this cache id is stable across
      # workflows. ci.yml's `release-build` dry-run uses the same
      # shared-key — a tag push pulls a warm cargo cache directly from
      # whatever PR last touched the workspace, making real releases
      # near-instant in the cargo phase.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Stage artifact + sha256
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rust-mcp-agent" "dist/${{ matrix.artifact }}"
          strip "dist/${{ matrix.artifact }}" || true
          (cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On tag push: github.ref_name is the tag (e.g. "v0.1.0").
          # On workflow_dispatch: take it from the user-supplied input
          # and let the action create the tag from the dispatched ref.
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          prerelease: ${{ inputs.prerelease || contains(github.ref_name, '-') }}
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
