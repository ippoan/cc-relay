name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: rust-mcp-agent-x86_64-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      # Same apt-package cache the ci.yml dry-run uses, so tag pushes
      # skip the apt-get update + install step too.
      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # Use `shared-key` (not `key`) so this cache id is stable across
      # workflows. ci.yml's `release-build` dry-run uses the same
      # shared-key, so a tag push pulls a warm cargo cache directly from
      # whatever PR last touched the workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Stage artifact + sha256
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rust-mcp-agent" "dist/${{ matrix.artifact }}"
          strip "dist/${{ matrix.artifact }}" || true
          (cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
