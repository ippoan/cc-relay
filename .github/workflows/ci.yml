name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Standard Rust CI (fmt / clippy / cargo test / cargo build --release) via
  # the shared reusable. The actual check names this exposes (per the GitHub
  # check-runs API, verified empirically on PR #63) are 2-tier:
  # `ci / rustfmt`, `ci / clippy`, `ci / cargo test`,
  # `ci / cargo build --release`. These are the names declared in
  # `.github/branch-protection.yml` (verified by the drift-check workflow).
  #
  # `main` branch protection still references the pre-reusable matrix-style
  # names (`rust (fmt)` / `rust (clippy)` / `rust (test)`). The compat-*
  # shim jobs below re-export the reusable's results under those legacy
  # names so the existing protection rule is satisfied as-is. Drop them
  # once admin updates the rule to point at the reusable's actual names
  # (e.g. via the new MCP admin endpoint `set_branch_protection`, or via
  # `gh api -X PUT` with `administration:write`, or via the UI).
  #
  # `upload_artifact: false` because the musl release build is produced by
  # `release.yml` on tag push; CI doesn't need to attach the native
  # x86_64-linux-gnu binary as an artifact. The release-build job below
  # warms the cross-build cache instead.
  ci:
    uses: ippoan/ci-workflows/.github/workflows/rust-ci.yml@main
    with:
      binary_name: rust-mcp-agent
      shared_key: cc-relay
      upload_artifact: false
      # Workspace cargo: build the actual binary (`agent-cli`) rather than
      # the default workspace build, matching what `release.yml` and the
      # `install-mcp.sh` consumer expect under `target/release/`.
      cargo_build_args: '--locked -p agent-cli'

  # 100% line coverage gate. Lives outside the reusable because the cc-relay
  # gate is repo-specific (coverage_100.toml + coverage_allowlist.txt) and
  # would bloat the shared workflow's surface for repos that don't enforce
  # coverage. Re-uses the workspace cargo cache via a dedicated shared-key.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cc-relay-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (workspace) + 100% gate
        run: bash scripts/coverage_gate.sh

  # Musl cross-build dry-run. Mirrors release.yml's build matrix so each PR
  # keeps the `release-x86_64-unknown-linux-musl` cache warm — real `v*.*.*`
  # tag pushes then build in seconds instead of minutes. No artifact upload
  # here (release.yml handles that on the tag itself).
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # `shared-key:` (not `key:`) so this cache id is stable across
      # workflows — `release.yml` pulls the same `release-${{ target }}` id
      # on its tag-triggered build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo build --release -p agent-cli (no upload)
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Report binary size + sha256
        run: |
          BIN="target/${{ matrix.target }}/release/rust-mcp-agent"
          echo "::notice::release binary (unstripped): $(ls -lh "$BIN" | awk '{print $5}')"
          strip "$BIN" || true
          echo "::notice::release binary (stripped): $(ls -lh "$BIN" | awk '{print $5}')"
          sha256sum "$BIN"

  # ── Compatibility shims for legacy `main` branch-protection check names ──
  # These emit check runs under the pre-reusable matrix-style names
  # (`rust (fmt)` / `rust (clippy)` / `rust (test)`) that `main` branch
  # protection's `Required status checks` list still references. Each shim
  # `needs: ci` so it waits for the reusable; if any reusable job fails the
  # shim is skipped, which branch protection treats as not-satisfied → the
  # PR stays blocked. Gating is preserved 1:1 with the underlying reusable.
  #
  # Delete this whole block in a follow-up PR after admin updates `main`
  # branch protection to use the reusable's actual check names
  # (`ci / rustfmt`, `ci / clippy`, `ci / cargo test`,
  # `ci / cargo build --release`) — also declared in
  # `.github/branch-protection.yml` for drift detection.
  #
  # `name:` (not the job id) drives the displayed check-run name that branch
  # protection matches on. The job ids stay alphanumeric-`_` per workflow
  # syntax rules.
  compat-rust-fmt:
    name: rust (fmt)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Pass-through indicator. Real check ran inside the ci/rust-ci.yml reusable as rustfmt."'

  compat-rust-clippy:
    name: rust (clippy)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Pass-through indicator. Real check ran inside the ci/rust-ci.yml reusable as clippy."'

  compat-rust-test:
    name: rust (test)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Pass-through indicator. Real check ran inside the ci/rust-ci.yml reusable as cargo test."'
