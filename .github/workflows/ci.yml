name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: fmt
          - kind: clippy
          - kind: test
          - kind: coverage
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      # fmt は cargo build しないので cache 不要。
      # clippy / test / coverage は別 artifact なので shared-key を matrix kind
      # で分けて save 衝突を避ける。save は main の push 時のみに絞り、PR は main
      # の cache を restore する。
      - uses: Swatinem/rust-cache@v2
        if: matrix.kind != 'fmt'
        with:
          shared-key: rust-${{ matrix.kind }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        if: matrix.kind == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.kind == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: matrix.kind == 'test'
        run: cargo test --workspace --all-features --no-fail-fast

      # Coverage gate. `cargo-llvm-cov` runs the workspace tests under
      # `-C instrument-coverage` and emits a per-file table. We then post-
      # process to assert that every reported file is at 100% line coverage,
      # ignoring the un-extractable I/O-loop bodies listed in
      # `scripts/coverage_ignore.txt`.
      - name: Install cargo-llvm-cov
        if: matrix.kind == 'coverage'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (workspace) + 100% gate
        if: matrix.kind == 'coverage'
        run: bash scripts/coverage_gate.sh

  # Release build dry-run: same target / toolchain / strip step as
  # release.yml, but no artifact upload. Catches breakage on the
  # `x86_64-unknown-linux-musl` path on every PR so a real `v*.*.*` tag
  # push won't surface a surprise build failure.
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      # apt-package cache for `musl-tools` — first run installs, every
      # subsequent run restores in ~1 s.
      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # Share the rust-cache id with release.yml so the cache we warm
      # here is what release.yml pulls on the next `v*.*.*` tag push.
      # `shared-key:` (not `key:`) is required for the id to be stable
      # across workflows — `key:` would mix in the per-job hash.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo build --release -p agent-cli (no upload)
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Report binary size + sha256
        run: |
          BIN="target/${{ matrix.target }}/release/rust-mcp-agent"
          echo "::notice::release binary (unstripped): $(ls -lh "$BIN" | awk '{print $5}')"
          strip "$BIN" || true
          echo "::notice::release binary (stripped): $(ls -lh "$BIN" | awk '{print $5}')"
          sha256sum "$BIN"
