name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: fmt
          - kind: clippy
          - kind: test
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.kind == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.kind == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: matrix.kind == 'test'
        run: cargo test --workspace --all-features --no-fail-fast

  # Release build dry-run: same target / toolchain / strip step as
  # release.yml, but no artifact upload. Catches breakage on the
  # `x86_64-unknown-linux-musl` path on every PR so a real `v*.*.*` tag
  # push won't surface a surprise build failure.
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      # Cache the apt download so subsequent runs skip the ~10–15 s
      # apt-get update + install dance. `musl-tools` is the only system
      # package the release path needs.
      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # Share the rust-cache key with release.yml so the cache populated
      # by a PR's dry-run is what release.yml pulls on the next `v*.*.*`
      # tag push — tag pushes are then near-instant cargo work.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo build --release -p agent-cli (no upload)
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Report binary size + sha256
        run: |
          BIN="target/${{ matrix.target }}/release/rust-mcp-agent"
          echo "::notice::release binary (unstripped): $(ls -lh "$BIN" | awk '{print $5}')"
          strip "$BIN" || true
          echo "::notice::release binary (stripped): $(ls -lh "$BIN" | awk '{print $5}')"
          sha256sum "$BIN"
