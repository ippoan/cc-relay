name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: fmt
          - kind: clippy
          - kind: test
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      # fmt は cargo build しないので cache 不要。
      # clippy / test は別 artifact なので shared-key を matrix kind で分けて save 衝突
      # ("Unable to reserve cache with key ..., another job may be creating this cache.")
      # を避ける。save は main の push 時のみに絞り、PR は main の cache を restore する。
      - uses: Swatinem/rust-cache@v2
        if: matrix.kind != 'fmt'
        with:
          shared-key: rust-${{ matrix.kind }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        if: matrix.kind == 'fmt'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.kind == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: matrix.kind == 'test'
        run: cargo test --workspace --all-features --no-fail-fast

  # Release build dry-run: same target / toolchain / strip step as
  # release.yml, but no artifact upload. Catches breakage on the
  # `x86_64-unknown-linux-musl` path on every PR so a real `v*.*.*` tag
  # push won't surface a surprise build failure.
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-dry-run-${{ matrix.target }}

      - name: cargo build --release -p agent-cli (no upload)
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Report binary size + sha256
        run: |
          BIN="target/${{ matrix.target }}/release/rust-mcp-agent"
          echo "::notice::release binary (unstripped): $(ls -lh "$BIN" | awk '{print $5}')"
          strip "$BIN" || true
          echo "::notice::release binary (stripped): $(ls -lh "$BIN" | awk '{print $5}')"
          sha256sum "$BIN"
