name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Standard Rust CI (fmt / clippy / cargo test / cargo build --release) via
  # the shared reusable. Job display names this exposes — `ci / rustfmt`,
  # `ci / clippy`, `ci / cargo test`, `ci / cargo build --release` — line up
  # with `main` branch protection's `Required status checks` so the gate
  # keeps applying without UI edits when this workflow lands.
  #
  # `upload_artifact: false` because the musl release build is produced by
  # `release.yml` on tag push; CI doesn't need to attach the native
  # x86_64-linux-gnu binary as an artifact. The release-build job below
  # warms the cross-build cache instead.
  ci:
    uses: ippoan/ci-workflows/.github/workflows/rust-ci.yml@main
    with:
      binary_name: rust-mcp-agent
      shared_key: cc-relay
      upload_artifact: false
      # Workspace cargo: build the actual binary (`agent-cli`) rather than
      # the default workspace build, matching what `release.yml` and the
      # `install-mcp.sh` consumer expect under `target/release/`.
      cargo_build_args: '--locked -p agent-cli'

  # 100% line coverage gate. Lives outside the reusable because the cc-relay
  # gate is repo-specific (coverage_100.toml + coverage_allowlist.txt) and
  # would bloat the shared workflow's surface for repos that don't enforce
  # coverage. Re-uses the workspace cargo cache via a dedicated shared-key.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cc-relay-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (workspace) + 100% gate
        run: bash scripts/coverage_gate.sh

  # Musl cross-build dry-run. Mirrors release.yml's build matrix so each PR
  # keeps the `release-x86_64-unknown-linux-musl` cache warm — real `v*.*.*`
  # tag pushes then build in seconds instead of minutes. No artifact upload
  # here (release.yml handles that on the tag itself).
  release-build:
    name: release-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache musl-tools (apt)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1

      # `shared-key:` (not `key:`) so this cache id is stable across
      # workflows — `release.yml` pulls the same `release-${{ target }}` id
      # on its tag-triggered build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo build --release -p agent-cli (no upload)
        run: cargo build --release --target ${{ matrix.target }} -p agent-cli

      - name: Report binary size + sha256
        run: |
          BIN="target/${{ matrix.target }}/release/rust-mcp-agent"
          echo "::notice::release binary (unstripped): $(ls -lh "$BIN" | awk '{print $5}')"
          strip "$BIN" || true
          echo "::notice::release binary (stripped): $(ls -lh "$BIN" | awk '{print $5}')"
          sha256sum "$BIN"
