# Branch protection IaC spec for cc-relay.
#
# This file is the single source of truth for what required status checks
# main branch protection should enforce. It is consumed by:
#
#   1. .github/workflows/branch-protection-drift.yml (this repo) — runs the
#      shared drift-check reusable to flag mismatches between `required_checks`
#      below and the actual check_run.name values produced by CI on main.
#   2. A future apply-from-spec reusable (ippoan/ci-workflows) that PUTs the
#      protection rule via the Branches API, closing the IaC loop.
#
# When CI job names change — e.g. moving to a reusable workflow, switching
# matrix shape, renaming a step — update this list **in the same PR**. The
# drift check will fail the PR if you forget, surfacing the silent
# "protection rule references a phantom check" failure mode that bit
# cc-relay PR #62 (the now-removed compat-rust-{fmt,clippy,test} shims).
#
# Check name conventions:
#   - Reusable workflow jobs nest the caller-job name: `<caller-workflow> /
#     <caller-job-id> / <reusable-job-name>`. The `ci:` job below calls
#     ippoan/ci-workflows/rust-ci.yml → 4 jobs surface as `ci / ci / <name>`.
#   - In-workflow jobs: `<caller-workflow> / <job-name>`. `coverage` and
#     `release-build (...)` are direct, so they show as `coverage` and
#     `release-build (x86_64-unknown-linux-musl)` respectively.

branch: main
required_checks:
  - "ci / ci / rustfmt"
  - "ci / ci / clippy"
  - "ci / ci / cargo test"
  - "ci / ci / cargo build --release"
  - "coverage"
  - "release-build (x86_64-unknown-linux-musl)"
