[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-mcp",
    "crates/agent-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ippoan/cc-relay"
authors = ["cc-relay contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
